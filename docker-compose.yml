# SPARK_HOME : répertoire personnel de l'utilisateur dont on gère les outils.
# Défaut /home/sparks pour cette machine ; sur une autre installation, poser
# SPARK_HOME dans un fichier .env à côté de ce compose (voir .env.example).
# Les deux côtés de chaque montage utilisent la même valeur, pour que les chemins
# affichés dans l'interface soient les vrais chemins de l'hôte.
services:
  app:
    build: .
    restart: unless-stopped
    pid: host
    ports:
      - "127.0.0.1:8081:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/gb10-tuning:/etc/gb10-tuning
      - ${SPARK_HOME:-/home/sparks}/comfyui-spark:${SPARK_HOME:-/home/sparks}/comfyui-spark
      - ${SPARK_HOME:-/home/sparks}/.config/opencode:${SPARK_HOME:-/home/sparks}/.config/opencode
      - ${SPARK_HOME:-/home/sparks}/.claude:${SPARK_HOME:-/home/sparks}/.claude
      # Fichier unique, lecture seule : on n'y lit que les mcpServers (global + par projet),
      # le reste est l'historique des projets et ne sort jamais de l'API.
      - ${SPARK_HOME:-/home/sparks}/.claude.json:${SPARK_HOME:-/home/sparks}/.claude.json:ro
      - ${SPARK_HOME:-/home/sparks}/.agents:${SPARK_HOME:-/home/sparks}/.agents
      # ~/.claude/skills/watch est un lien vers ce répertoire : sans ce montage
      # le lien est cassé dans le conteneur et la skill disparaît de la liste.
      # Lecture seule : on n'édite jamais une skill qui appartient à un plugin.
      - ${SPARK_HOME:-/home/sparks}/.local/share/claude-plugins:${SPARK_HOME:-/home/sparks}/.local/share/claude-plugins:ro
      - /sys:/host/sys:ro
      # Si /etc/dgx-release n'existe pas sur cette machine, ce montage empêche le conteneur de démarrer.
      - /etc/dgx-release:/etc/dgx-release:ro
      # Sans lui, l'app rapporterait la distribution de SON image (Debian) au lieu de celle de la machine.
      - /etc/os-release:/host/etc/os-release:ro
    extra_hosts:
      # ollama-api publie 11434 sur l'hôte et vit sur un autre réseau docker :
      # depuis ce conteneur, localhost ne l'atteint pas, la passerelle hôte si.
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=3001
      - OLLAMA_URL=http://host.docker.internal:11434
      # Le backend a des défauts en dur pour ces chemins (pratiques hors Docker) :
      # on les pose ici explicitement pour que SPARK_HOME fasse réellement foi.
      - COMFY_DIR=${SPARK_HOME:-/home/sparks}/comfyui-spark
      - OPENCODE_DIR=${SPARK_HOME:-/home/sparks}/.config/opencode
      - CLAUDE_DIR=${SPARK_HOME:-/home/sparks}/.claude
      - CLAUDE_JSON=${SPARK_HOME:-/home/sparks}/.claude.json
      - SKILLS_CLAUDE_DIR=${SPARK_HOME:-/home/sparks}/.claude/skills
      - SKILLS_AGENTS_DIR=${SPARK_HOME:-/home/sparks}/.agents/skills
      - SKILLS_OPENCODE_DIR=${SPARK_HOME:-/home/sparks}/.config/opencode/skills
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
