services:
  app:
    build: .
    restart: unless-stopped
    pid: host
    ports:
      - "127.0.0.1:8081:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/gb10-tuning:/etc/gb10-tuning
      - /home/sparks/comfyui-spark:/home/sparks/comfyui-spark
      - /home/sparks/.config/opencode:/home/sparks/.config/opencode
      - /home/sparks/.claude:/home/sparks/.claude
      # Fichier unique, lecture seule : on n'y lit que les mcpServers (global + par projet),
      # le reste est l'historique des projets et ne sort jamais de l'API.
      - /home/sparks/.claude.json:/home/sparks/.claude.json:ro
      - /home/sparks/.agents:/home/sparks/.agents
      # ~/.claude/skills/watch est un lien vers ce répertoire : sans ce montage
      # le lien est cassé dans le conteneur et la skill disparaît de la liste.
      # Lecture seule : on n'édite jamais une skill qui appartient à un plugin.
      - /home/sparks/.local/share/claude-plugins:/home/sparks/.local/share/claude-plugins:ro
    extra_hosts:
      # ollama-api publie 11434 sur l'hôte et vit sur un autre réseau docker :
      # depuis ce conteneur, localhost ne l'atteint pas, la passerelle hôte si.
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=3001
      - OLLAMA_URL=http://host.docker.internal:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
