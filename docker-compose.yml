# SPARK_HOME : répertoire personnel de l'utilisateur dont on gère les outils.
# Détecté automatiquement : par défaut le $HOME de l'utilisateur qui lance le
# compose, donc rien à régler sur une installation neuve. Poser SPARK_HOME dans
# un fichier .env à côté de ce compose (voir .env.example) uniquement si les
# outils à gérer appartiennent à un AUTRE utilisateur que celui qui lance le
# compose, ou si HOME n'est pas défini dans l'environnement appelant (certains
# contextes systemd/cron) : compose avertit alors et résout une chaîne vide.
# Les deux côtés de chaque montage utilisent la même valeur, pour que les chemins
# affichés dans l'interface soient les vrais chemins de l'hôte.
services:
  app:
    build: .
    restart: unless-stopped
    pid: host
    ports:
      - "127.0.0.1:8081:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/gb10-tuning:/etc/gb10-tuning
      - ${SPARK_HOME:-$HOME}/comfyui-spark:${SPARK_HOME:-$HOME}/comfyui-spark
      - ${SPARK_HOME:-$HOME}/.config/opencode:${SPARK_HOME:-$HOME}/.config/opencode
      - ${SPARK_HOME:-$HOME}/.claude:${SPARK_HOME:-$HOME}/.claude
      # Fichier unique, lecture seule : on n'y lit que les mcpServers (global + par projet),
      # le reste est l'historique des projets et ne sort jamais de l'API.
      - ${SPARK_HOME:-$HOME}/.claude.json:${SPARK_HOME:-$HOME}/.claude.json:ro
      - ${SPARK_HOME:-$HOME}/.agents:${SPARK_HOME:-$HOME}/.agents
      # ~/.claude/skills/watch est un lien vers ce répertoire : sans ce montage
      # le lien est cassé dans le conteneur et la skill disparaît de la liste.
      # Lecture seule : on n'édite jamais une skill qui appartient à un plugin.
      - ${SPARK_HOME:-$HOME}/.local/share/claude-plugins:${SPARK_HOME:-$HOME}/.local/share/claude-plugins:ro
      - /sys:/host/sys:ro
      # Si /etc/dgx-release n'existe pas sur cette machine, ce montage empêche le conteneur de démarrer.
      - /etc/dgx-release:/etc/dgx-release:ro
      # Sans lui, l'app rapporterait la distribution de SON image (Debian) au lieu de celle de la machine.
      - /etc/os-release:/host/etc/os-release:ro
      # Mises à jour système : source de vérité = apt côté hôte, jamais le DGX Dashboard.
      # Lecture seule : le flux ne va que de la machine vers l'app (voir host/dgx-updates/README).
      - /var/lib/update-notifier:/var/lib/update-notifier:ro
      - /var/lib/spark-control-center:/var/lib/spark-control-center:ro
      - /var/lib/apt/periodic:/var/lib/apt/periodic:ro
    extra_hosts:
      # ollama-api publie 11434 sur l'hôte et vit sur un autre réseau docker :
      # depuis ce conteneur, localhost ne l'atteint pas, la passerelle hôte si.
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=3001
      - OLLAMA_URL=http://host.docker.internal:11434
      # Hors Docker le backend retombe sur le home de l'utilisateur courant ; dans le
      # conteneur il tourne en root, où ce home est /root et ne contient rien de tout
      # cela. Ces variables sont donc ce qui fait réellement foi ici, pas un repli.
      - COMFY_DIR=${SPARK_HOME:-$HOME}/comfyui-spark
      - OPENCODE_DIR=${SPARK_HOME:-$HOME}/.config/opencode
      - CLAUDE_DIR=${SPARK_HOME:-$HOME}/.claude
      - CLAUDE_JSON=${SPARK_HOME:-$HOME}/.claude.json
      - SKILLS_CLAUDE_DIR=${SPARK_HOME:-$HOME}/.claude/skills
      - SKILLS_AGENTS_DIR=${SPARK_HOME:-$HOME}/.agents/skills
      - SKILLS_OPENCODE_DIR=${SPARK_HOME:-$HOME}/.config/opencode/skills
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
